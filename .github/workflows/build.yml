name: build-para-yadominios-cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Ninguna clave puede llegar al repositorio ni al sitio publicado. Solo la
      # historia del código (HEAD): la rama yapanel-build guarda el sitio ya
      # compilado, que se parece a claves y daría falsas alarmas.
      - name: Buscar claves filtradas
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --log-opts="HEAD"
          rm gitleaks

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Compuerta: si los tipos, el lint o una prueba están en rojo, no se
      # publica nada. Se arregla el cambio, no se apaga la prueba.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Convierte el build de Next.js en un Worker de Cloudflare.
      - run: npx opennextjs-cloudflare build

      # YaDominios Cloud solo acepta UN archivo `_worker.js`, y el .open-next
      # crudo son más de mil archivos. El empaquetado lo hace wrangler y no
      # esbuild a mano: el bundle de esbuild compila, pero al arrancar revienta
      # con "Dynamic require of 'fs' is not supported". Probado con workerd.
      # `--dry-run` no toca ninguna cuenta de Cloudflare: solo escribe el archivo.
      # Después, limpiar-worker.js deja UN solo export (default): OpenNext
      # exporta clases de Durable Objects que la plataforma no soporta.
      - name: Empaquetar en un solo _worker.js
        run: |
          npx wrangler deploy --dry-run --outdir=.dist-worker --minify
          mkdir out-deploy
          cp .dist-worker/worker.js out-deploy/_worker.js
          node herramientas/limpiar-worker.js out-deploy/_worker.js
          cp -r .open-next/assets/* out-deploy/ 2>/dev/null || true
          cp yadominios.json out-deploy/ 2>/dev/null || true
          echo "Tamaño del worker:" && du -h out-deploy/_worker.js
          echo "Exports finales:" && tail -c 60 out-deploy/_worker.js

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: yapanel-build
          publish_dir: ./out-deploy
