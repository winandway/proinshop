name: verificar

# Lo mismo que `npm run verify`, en cada cambio que llegue a GitHub, también
# en las ramas y en las propuestas de cambio (PR).
on:
  push:
    branches-ignore: [main, yapanel-build]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Ninguna clave puede entrar al repositorio. Revisa todo el historial.
      - name: Buscar claves filtradas
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
