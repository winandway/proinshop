name: verificar

# Lo mismo que `npm run verify`, en cada cambio que llegue a GitHub, también
# en las ramas y en las propuestas de cambio (PR).
on:
  push:
    branches-ignore: [main, yapanel-build]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
